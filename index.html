/* 手写体：站酷快乐体子集（ZCOOL KuaiLe，OFL）。
   风格：工位桌面。墨绿桌垫上摆着台历、考勤机、牛皮纸文件夹、便利贴、便函、工牌；按钮是黏土块。
   字体：黑体管数字和规则；手写体只给“人说的话”（便利贴、领导原话）；时钟是画出来的七段数码管。 */
:root{
  --mat:#2a5149; --matHi:#2f5a51; --paper:#f6efdf; --paperInk:#2d3437; --mute:#7a7f80;
  --manila:#e9cd95; --manilaDk:#c9a462; --manilaInk:#5c4618;
  --note:#ffe27a; --red:#c8463a; --amber:#ffc95e; --panel:#1f2a2e; --lcdOn:#9ff0b8;
  --green:#2f7d6b; --orange:#c87a1a;
  --sans:"Noto SC Game","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --hand:"Hand Game","Noto SC Game",cursive;
}
/* 手写体只有简体中文字形：其他语言统一用黑体，免得一行里两种字体 */
:root.nohand{--hand:"Noto SC Game",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0e1b22;color:var(--paperInk);font-family:var(--sans);overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;font-size:inherit;text-align:inherit}
button:focus-visible{outline:3px solid #fff8;outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.ico{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.12em}
/* 完整布局按 780 高来排，屏幕不够高就整体等比缩小（zoom），宽度不够填满时左右留深色边；位置、尺寸、缩放都由 layoutApp() 算 */
#app{position:fixed;left:0;top:0;width:100%;max-width:440px;height:100%;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 30%,var(--matHi),var(--mat));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app.desk{border-radius:24px;box-shadow:0 20px 60px #000a}
#screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden}
#screen>*{flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.off{opacity:.42;filter:saturate(.5)}

/* ---------- 黏土按钮：厚、圆、有下沿，一个动作一种颜色 ---------- */
.cb{--c:#f6efdf;--e:#c9bfa8;--t:#2d3437;position:relative;border-radius:18px;background:var(--c);color:var(--t);
  box-shadow:inset 0 2px 0 #ffffff80,0 5px 0 var(--e),0 8px 10px #0004;
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 12px;text-align:left}
.cb:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ffffff80,0 2px 0 var(--e),0 3px 5px #0004}
.cb .ico{grid-row:1/3;font-size:24px}
.cb span{font-size:16px;font-weight:900;line-height:1.15}
.cb small{font-size:11px;font-weight:500;opacity:.78;white-space:nowrap}
.cb.mint{--c:#8fdcc6;--e:#2f7d6b;--t:#123d33}
.cb.coral{--c:#ff9f86;--e:#b0503c;--t:#4a1408}
.cb.lilac{--c:#d9d2f0;--e:#8f84b8;--t:#2d2650}
.cb.yellow{--c:#ffe08a;--e:#c29a2e;--t:#4a3a08}
.cb.danger{--c:#e86a55;--e:#8d2f20;--t:#fff}
.cb.hot{outline:3px solid #fffb;outline-offset:2px}
.hand{position:absolute;left:50%;bottom:-24px;width:32px;height:36px;margin-left:-14px;z-index:3;pointer-events:none;animation:bob .9s ease-in-out infinite alternate;filter:drop-shadow(0 2px 3px #0007)}
.hand svg{width:100%;height:100%;display:block}
.dur .hand{bottom:-30px}
.dur.hot{outline:3px solid #fffb;outline-offset:2px}
@keyframes bob{from{transform:translateY(4px)}to{transform:translateY(-3px)}}
.tipnote .tut{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:#a07a10;margin-bottom:2px}
.cb.wide{display:flex;justify-content:center;align-items:center;gap:8px;font-size:17px;font-weight:900;height:56px}
.cb.wide span{font-size:17px}

/* ---------- 提示：小便利贴 ---------- */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:90;pointer-events:none;
  width:calc(100% - 48px);display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:var(--note);color:#4a3d10;padding:8px 14px;font-size:13.5px;font-weight:700;line-height:1.45;box-shadow:0 4px 10px #0005;
  animation:pop .25s ease-out;text-align:center;transform:rotate(-1deg)}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}

/* ---------- 顶栏：台历 + 考勤机 + 菜单/头像 ---------- */
.hud{display:flex;align-items:stretch;gap:8px;padding:10px 12px 6px}
.cal{width:60px;flex:none;background:var(--paper);border-radius:8px;overflow:hidden;text-align:center;box-shadow:0 2px 0 #0003;display:flex;flex-direction:column}
.cal .ch{background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:4px 0 3px}
.cal .cd{flex:1;display:grid;place-items:center;font-size:40px;font-weight:900;line-height:1}
.cal .ct{font-size:11px;color:var(--mute);padding-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;padding-right:2px}
.punch{flex:1;min-width:0;background:var(--panel);border-radius:10px;padding:6px 8px 4px;display:flex;flex-direction:column;gap:5px;box-shadow:0 2px 0 #0003}
.lcd{background:#14201b;border-radius:6px;box-shadow:inset 0 2px 6px #000a;padding:3px 8px 6px;display:flex;flex-direction:column;align-items:center}
.lcd .ind{align-self:stretch;display:flex;justify-content:space-between;font-size:10px;font-weight:700;line-height:14px;letter-spacing:.06em;color:#9ff0b84d}
.lcd .ind b{color:var(--lcdOn)}
.lcd svg{display:block;height:44px;width:auto;max-width:100%}
.seg{fill:var(--lcdOn);filter:drop-shadow(0 0 3px #9ff0b866)}
.segOff{fill:#ffffff0d}
.punch.ot .seg{fill:var(--amber);filter:drop-shadow(0 0 3px #ffc95e66)} .punch.ot .ind b{color:var(--amber)}
.punch.late .seg,.punch.ban .seg{fill:#ff9c83;filter:drop-shadow(0 0 3px #ff9c8366)} .punch.late .ind b,.punch.ban .ind b,.lcd .ind b.warn{color:#ff9c83}
.daybar{position:relative;height:5px;border-radius:9px;background:#ffffff1f;margin:2px 2px 0}
.daybar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--lcdOn);transition:width .12s linear}
.punch.ot .daybar i{background:var(--amber)} .punch.late .daybar i,.punch.ban .daybar i{background:#ff9c83}
.daybar b{position:absolute;top:-3px;width:2px;height:11px;background:#fff;border-radius:2px}
.dayrow{position:relative;height:13px;font-size:10px;color:#cfd6d8}
.dayrow span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.menu2{width:60px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--paper);border-radius:8px;font-size:14px;white-space:nowrap;letter-spacing:-.02em;font-weight:900;box-shadow:0 2px 0 #0003}
.menu2 svg{width:30px;height:24px;display:block}
.bosses{display:flex;align-items:center;gap:8px;margin:2px 12px 0;padding:3px 12px 3px 3px;align-self:flex-start;background:#0003;border-radius:99px;font-size:12px;color:#e8f2ee}
.bosses span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bosses small{color:#cfe5dc99;font-size:11px}
.faces{display:flex;flex:none}
.faces img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#c3d1c6;border:2px solid var(--paper);margin-right:-7px}
.faces img:last-child{margin-right:0}

/* ---------- 办公室 ---------- */
.scene{position:relative;flex:1 1 auto!important;min-height:140px}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.state{position:absolute;right:12px;bottom:4px;font-size:12px;font-weight:700;background:var(--paper);padding:3px 10px;border-radius:99px;box-shadow:0 2px 0 #0003}

/* ---------- 信息区：文件夹 / 效率卡+便利贴 / 竖温度计 ---------- */
.info{display:grid;grid-template-columns:62px 1fr;grid-template-rows:auto auto;gap:12px 10px;margin:12px 12px 8px}
.info .folder,.info .lower{grid-column:2}
.folder{position:relative;background:var(--manila);border-radius:0 10px 10px 10px;padding:9px 12px 9px;box-shadow:0 3px 0 var(--manilaDk)}
.folder::before{content:attr(data-tab);position:absolute;top:-18px;left:0;height:19px;padding:0 14px;background:var(--manila);border-radius:7px 7px 0 0;font-size:11px;font-weight:700;color:var(--manilaInk);line-height:20px}
.folder .hd{display:flex;justify-content:space-between;align-items:baseline}
.folder .big{font-size:24px;font-weight:900;color:#3b2f12}
.folder .big small{font-size:12px;font-weight:500;color:var(--manilaInk)}
.folder .due{font-size:12px;color:var(--manilaInk)}
.folder .due b{font-size:15px;color:var(--red)}
.grid26{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:6px}
.grid26 i{aspect-ratio:1.25;border-radius:3px;background:#fff9;position:relative;overflow:hidden}
.grid26 i.on{background:var(--green)}
.grid26 i .p{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.grid26 i .d{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#e08a2c 0 3px,#f3c27b 3px 6px)}
.folder .lg{font-size:11px;color:var(--manilaInk);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.folder .lg b{color:#a85512}
/* 这一行和操作区都固定高度：内容变化（有没有便利贴、效率明细几行、工作中/空闲）不能挤动上面的办公室 */
.lower{display:flex;gap:10px;align-items:stretch;height:112px}
.eff{flex:1;min-width:0;overflow:hidden;background:var(--paper);border-radius:10px;box-shadow:0 2px 0 #0003;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.eff .eh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.eff .eh b{font-size:22px;line-height:1}
.ebar{height:6px;border-radius:9px;background:#e6ddc9;overflow:hidden}
.ebar i{display:block;height:100%;border-radius:9px}
.eff ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.eff li{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:#5f6669;line-height:1.3}
.eff li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eff li em{font-style:normal;font-weight:700;color:var(--green);white-space:nowrap}
.eff li em.neg{color:var(--red)}
.eff ul.two{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.eff ul.two li{font-size:10px}
.tipnote{position:relative;width:118px;flex:none;align-self:stretch;overflow:hidden;background:linear-gradient(170deg,#fff0a6,#ffe27a 70%,#f2cf5f);padding:16px 11px 10px;
  transform:rotate(2deg);color:#4a3d10;box-shadow:2px 6px 8px -2px #0005;clip-path:polygon(0 0,100% 0,100% 84%,88% 100%,0 100%)}
.tipnote::before{content:"";position:absolute;top:4px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c8463a);box-shadow:0 2px 2px #0005}
.tipnote::after{content:"";position:absolute;right:0;bottom:0;width:12%;height:16%;background:linear-gradient(315deg,transparent 48%,#d8b74e 50%,#f6e08f)}

const office={imgs:{}};

function lighting(minute){
  if(minute<=900)return[1,0,0];
  if(minute<=1110){const t=(minute-900)/210;return[1-t,t,0]}
  const t=Math.min(1,Math.max(0,(minute-1110)/120));return[0,1-t,t];
}
function drawOffice(cv,minute,row,frame){
  const dpr=Math.min(3,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,wt=lighting(minute);
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.clearRect(0,0,W,H);
  // 帧 960×600，办公室实际占 x 7.8%—90%、y 6.3%—89.8%：裁到贴边，内容中心对齐画布中心（水平、垂直都居中）
  const FW=960,FH=600,scale=Math.min(W/(FW*0.86),H/(FH*0.87));
  const dw=FW*scale,dh=FH*scale,dx=W/2-0.489*dw,dy=H/2-0.481*dh;
  const sh=c.createRadialGradient(W/2,dy+0.86*dh,0,W/2,dy+0.86*dh,dw*0.44);
  sh.addColorStop(0,'rgba(0,0,0,.3)');sh.addColorStop(1,'rgba(0,0,0,0)');
  c.save();c.translate(0,dy+0.86*dh);c.scale(1,.2);c.translate(0,-(dy+0.86*dh));c.fillStyle=sh;c.fillRect(0,-H*6,W,H*12);c.restore();  // 填充要盖住整个椭圆，否则矩形边缘会切出一道硬线
  const alphas=[1,wt[1]/Math.max(wt[0]+wt[1],.001),wt[2]];
  ['day','sunset','night'].forEach((n,i)=>{const im=office.imgs[n];if(!im.complete||!im.naturalWidth||alphas[i]<=0)return;
    c.globalAlpha=alphas[i];c.drawImage(im,frame*FW,row*FH,FW,FH,dx,dy,dw,dh)});
  c.globalAlpha=1;
}

// 产出效率：压力与加班 × 今日环境 × 领导效果；逐项列出
function effInfo(s){
  const base=game.efficiency(),ot=s.minute>=1080,rows=[];
  rows.push({t:t('eff.stress'),v:Math.round(base*100)+'%',neg:base<.7});
  if(!L.workday(s.day)||s.sealed)return{total:base,rows};
  if(game.mentoring())rows.push({t:t('eff.mentor'),v:'−75%',neg:true},{t:t('eff.mentorStress'),v:t('ui.perHour',{n:'+2'}),neg:true});
  else{const ch=Math.round((s.rate-1)*100);rows.push({t:t('eff.today',{rate:t(L.RATE_NAMES[s.rate_index])}),v:(ch>=0?'+':'−')+Math.abs(ch)+'%',neg:ch<0})}
  if(game.hasTrait('leader_06')&&s.pressure&&!s.pressure_waived)rows.push({t:t('eff.lecture'),v:'−30%',neg:true});
  if(game.hasTrait('leader_16')&&ot)rows.push({t:t('eff.flatbread'),v:'+5%',neg:false});
  if(s.extra_fatigue>0)rows.push({t:t('eff.ignored'),v:t('ui.perHour',{n:'+2'}),neg:true});
  return{total:base*s.rate*game.productionMultiplier(ot),rows};
}
const slackPct=()=>Math.round(game.slackRisk()*100);
function guide(s){
  if(s.phase==='choice')return null;
  if(s.sealed)return{b:t('g.sealed.b'),d:t('g.sealed.d'),k:'done'};
  if(s.phase==='running')return ui.paused?{b:t('g.paused.b'),d:t('g.paused.d'),k:'clock'}:{b:t('g.running.b'),d:t('g.running.d'),k:'clock'};
  const sub=game.submitMinutes(ui.useEv),finish=endTime(s.minute,sub),shut=game.shutdownTime();
  if(s.draft>0&&finish>shut)return{b:t('g.tooLate.b'),d:t('g.tooLate.d'),k:'alert'};
  // 按紧急程度：压力太高 → 深夜还有草稿没交 → 快到 HR 红线 → 平时的提交/休息建议（warn 让便签变红，并压过新手引导）
  const canRest=endTime(s.minute,30)<=shut;
  if(s.fatigue>=70&&canRest)return s.fatigue>=85
    ?{b:t('g.collapse.b'),d:t('g.collapse.d'),k:'rest',warn:true}
    :{b:t('g.high.b'),d:t('g.high.d',{eff:Math.round(game.efficiency()*100),n:game.restRecovery()}),k:'rest',warn:true};
  if(s.draft>0&&s.minute>=1200&&game.submissionBlock()==='')return{b:t('g.otSubmit.b'),d:t('g.otSubmit.d'),k:'submit',warn:true};
  if(!game.overtimeBlocked()&&s.month>=2400&&s.minute>=1080)return{b:t('g.hrLine.b'),d:t('g.hrLine.d',{h:(s.month/60).toFixed(1)}),k:'home',warn:true};
  if(s.draft>0&&(game.projectRemaining()===0||s.draft>=60000||finish+30>=shut)){
    if(game.submissionBlock()!=='')return{b:t('g.more.b'),d:t('g.more.d'),k:'work'};
    return{b:t('g.submit.b'),d:t('g.submit.d'),k:'submit'};
  }
  if(s.fatigue>=40&&endTime(s.minute,30)<=shut)return{b:t('g.rest.b'),d:t(game.slackRisk()?'g.rest.dRisk':'g.rest.d',{n:game.restRecovery(),p:slackPct()}),k:'rest'};
  if(s.minute>=shut-30)return{b:t('g.closing.b'),d:t('g.closing.d'),k:'clock'};
  if(!s.tutorial_worked)return{b:t('g.first.b'),d:t('g.first.d'),k:'work'};
  if(s.minute>=game.earliestDeparture()&&s.draft===0)return{b:t('g.canLeave.b'),d:t('g.canLeave.d'),k:'home'};
  return{b:t('g.keep.b'),d:t('g.keep.d'),k:'work'};
}
function controls(s){
  const idle=game.canAct(),shut=game.shutdownTime();
  const sub=game.submitMinutes(ui.useEv),finish=endTime(s.minute,s.draft>0?sub:0),block=game.submissionBlock();
  const validSubmit=s.draft>0&&block===''&&finish<=shut;
  const busyWhy=s.phase==='choice'?t('why.event'):s.phase==='running'?t('why.busy'):'';
  const late=t('why.late',{time:clock(shut)});
  const c={};
  c.work=idle&&game.projectRemaining()>0&&!s.sealed?'':(busyWhy||(s.sealed?t('why.sealed'):t('why.enough')));
  c.rest=idle&&endTime(s.minute,30)<=shut?'':(busyWhy||t('why.noRest'));
  c.evidence=idle&&s.evidence<3&&s.crafted<2&&endTime(s.minute,game.evidenceMinutes())<=shut?'':
    (busyWhy||(s.evidence>=3?t('why.recFull'):s.crafted>=2?t('why.recDay'):late));
  c.submit=idle&&validSubmit?'':(busyWhy||(s.draft<=0?t('why.noDraft'):(block&&t(block,{n:pts(s.draft)}))||late));
  c.discard=s.draft>0&&s.minute>=game.earliestDeparture()&&(finish+game.departureDelay()>shut||block!=='');
  c.home=idle&&(s.draft===0||validSubmit)&&finish+game.departureDelay()<=shut?'':(busyWhy||(c.discard?t('why.discardOnly'):late));
  c.subMin=sub; c.waived=game.submissionWaiver(ui.useEv);
  return c;
}
// 还剩几个工作日（今天没下班也算一天）
function workdaysLeft(s){
  let n=0;for(let d=s.day+1;d<=30;d++)if(L.workday(d))n++;
  if(L.workday(s.day)&&!['summary','ending'].includes(s.phase))n++;
  return n;
}
// 这个月已经见过的领导（到当前这周为止，按出场顺序）
function metLeaders(s){
  const ids=[],weeks=Math.min(5,L.weekNumber(s.day));
  for(let w=1;w<=weeks;w++)for(const id of (s.weekly_traits[w]||[]))if(!ids.includes(id))ids.push(id);
  return ids;
}
// 见过的最烦领导（HARD_LEADERS 按烦度排序，文盲最烦）；没有就取第一个
function worstMet(s){const met=metLeaders(s);return L.HARD_LEADERS.find(id=>met.includes(id))||met[0]}

const H=(k,v)=>[t('honor.'+k+'.t'),t('honor.'+k+'.d',v)];
function honor(s){
  const won=s.formal>=L.TOTAL,h=s.month/60,sick=s.sick_days||0;
  if(won){
    if(h<8)return H('punctual');
    if(s.day<=22)return H('fast',{n:30-s.day});
    if(sick>0)return H('sick',{n:sick});
    if(s.hr_count>0)return H('hr');
    if(h>=40)return H('grind',{n:h.toFixed(0)});
    return H('warrior');
  }
  const pt=s.formal/1000;
  if(pt>=2400)return H('close',{n:Math.ceil(2600-pt)});
  if(sick>=2)return H('health',{n:sick});
  if(h>=40)return H('lastGrind',{n:h.toFixed(0)});
  return H('next');
}

/* ---------------------------------------------------------------- 操作 */
function startRun(seed){
  game.newRun(seed);ui.seenNotes=game.s.history.length;ui.view='play';ui.intro=true;ui.overlay=null;ui.paused=true;persist();
}
function tryReq(kind,minutes,why){
  if(why){toast(why);return}
  if(game.request(kind,minutes,ui.useEv))ui.paused=false;
}
function act(a,x){
  const s=game.s;
  switch(a){
    case 'new':if(!cloud.ready){toast(CLOUD_TEXT(cloud.status)||t('cloud.preparing'));break}startRun(1+Math.floor(Math.random()*999999998));break;
    case 'same':startRun(s.seed);break;
    case 'continue':{if(!cloud.ready){toast(CLOUD_TEXT(cloud.status)||t('cloud.preparing'));break}const d=load(SAVE_KEY,null);if(d&&game.load(d)){ui.view='play';ui.intro=false;ui.paused=true;ui.seenNotes=game.s.history.length}else toast(t('toast.noSave'));break}
    case 'help':ui.overlay='help';break;
    case 'title':persist();ui.view='title';ui.overlay=null;break;
    case 'accept':ui.intro=false;break;
    case 'weekAck':game.acknowledgeWeek();break;
    case 'begin':game.beginDay();ui.paused=false;break;
    case 'next':game.nextDay();ui.paused=true;break;
    case 'menu':ui.overlay='menu';ui.paused=true;break;
    case 'calendar':ui.overlay='calendar';ui.paused=true;break;
    case 'share':openShare();break;
    case 'shareSys':if(ui.share&&ui.share.file)navigator.share({files:[ui.share.file],title:t('ui.gameName'),text:t('share.text',{honor:honor(s)[0],url:SHARE_URL})}).catch(()=>{});break;
    case 'traits':ui.overlay='traits';ui.paused=true;break;
    case 'catalog':ui.overlay='catalog';break;
    case 'ledger':ui.overlay='ledger';ui.paused=true;break;
    case 'close':ui.overlay=null;break;
    case 'useEv':ui.useEv=!ui.useEv;savePrefs();break;
    case 'cyc':ui.dur=[15,30,60,120][([15,30,60,120].indexOf(ui.dur)+1)%4];savePrefs();break;
    case 'work':{const c=controls(s);tryReq('work',ui.dur,c.work);break}
    case 'rest':{const c=controls(s);tryReq('rest',30,c.rest);break}
    case 'evidence':{const c=controls(s);tryReq('evidence',0,c.evidence);break}
    case 'submit':{const c=controls(s);tryReq('submit',0,c.submit);break}
    case 'home':{const c=controls(s);tryReq('finish_day',0,c.home);break}
    case 'discardAsk':ui.overlay='discard';break;
    case 'discard':ui.overlay=null;if(game.request('discard'))ui.paused=false;break;
    case 'choose':{const i=+x;if(game.optionEnabled(i)){game.choose(i);ui.paused=false}else{const o=s.event.options[i];toast(s.evidence<o.cost?t('toast.noRec'):t('why.recFull'))}break}
    case 'pause':ui.paused=!ui.paused;break;
    case 'fast':ui.fast=true;ui.paused=false;break;
    case 'cancel':game.cancelPlan();break;
  }
  if(['work','rest','evidence','submit','home','cyc'].includes(a))tutAfter(a);
  if(ui.view==='play')persist();
  dirty=true;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;act(b.dataset.a,b.dataset.x)});
document.addEventListener('keydown',e=>{
  if(ui.view!=='play'||e.repeat)return;
  const s=game.s;
  if(e.key==='Escape'){act(ui.overlay?'close':'menu');e.preventDefault();return}
  if(ui.overlay)return;
  if(e.code==='Space'){e.preventDefault();if(s.phase==='idle')act('work');else if(s.phase==='running')act('pause')}
  else if(e.key==='p'||e.key==='P'){if(s.phase==='running')act('pause')}
  else if(e.key==='q'||e.key==='Q')act('cyc');
  else if(e.key>='1'&&e.key<='4'&&s.phase==='choice')act('choose',String(+e.key-1));
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){ui.paused=true;persist();dirty=true}});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.shareimg'))e.preventDefault()});
game.onChange=()=>{dirty=true};

/* ---------------------------------------------------------------- 主循环 */
let dirty=true,last=performance.now(),artT=0,lastFrameKey='';
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;artT+=dt;
  const s=game.s;
  if(ui.view==='play'&&!ui.overlay&&s.phase==='running'&&!ui.paused){
    ui.elapsed+=dt*PLAYBACK;const iv=ui.fast?.04:.55;let n=0;
    while(ui.elapsed>=iv&&game.s.phase==='running'&&n<24){ui.elapsed-=iv;n++;game.step()}
    if(n){flushNotes();if(now-ui.lastSave>1500)persist()}
  }else{ui.elapsed=0;ui.fast=false}
  if(dirty){dirty=false;try{render()}catch(err){showError(err)}}
  const cv=ui.view==='title'?$('heroCv'):$('cv');
  if(cv){
    let row=0,minute=1050;
    if(ui.view==='play'&&s.day){minute=s.minute;
      if(s.phase==='choice'||game.mentoring())row=3;
      else if(s.phase==='running'&&s.jobs.length){const k=s.jobs[0].kind;row=k==='work'?1:k==='rest'?2:0}}
    let f=Math.floor(artT*(row===1||row===3?8:4))%4;
    if(ui.view==='play'&&(ui.paused||s.phase!=='running')&&row!==3)f=0;
    const key=[cv.id,cv.clientWidth,cv.clientHeight,minute,row,f,office.ready].join();
    if(key!==lastFrameKey){lastFrameKey=key;drawOffice(cv,minute,row,f)}
  }
  requestAnimationFrame(frame);
}
Object.values(office.imgs).forEach(im=>im.addEventListener('load',()=>{office.ready=(office.ready||0)+1}));
// 布局：完整版按 780 高排。屏幕不够高就整体等比缩小（最小 0.8），缩小后宽度填不满就左右留边；
// 缩到 0.8 还放不下，才启用紧凑样式（cmp1 / cmp2，按缩放后的逻辑高度判断）。
const app=$('app'),FULL_H=780,MIN_S=.8;
function layoutApp(){
  const vv=window.visualViewport,vw=(vv&&vv.width)||window.innerWidth,vh=(vv&&vv.height)||window.innerHeight;
  const desk=vw>=600,availH=desk?Math.min(vh-24,900):vh;
  const s=Math.max(MIN_S,Math.min(1,availH/FULL_H)),Lh=availH/s,Lw=Math.min(440,vw/s);
  app.style.zoom=s===1?'':s.toFixed(4);
  app.style.width=Lw+'px';app.style.height=Lh+'px';
  // zoom 元素自己的 left/top 也会被缩放，所以除以 s
  app.style.left=((vw-Lw*s)/2/s)+'px';app.style.top=(desk?(vh-Lh*s)/2/s:0)+'px';
  app.classList.toggle('desk',desk);app.classList.toggle('cmp1',Lh<FULL_H-1);app.classList.toggle('cmp2',Lh<690);
  dirty=true;lastFrameKey='';
}
window.addEventListener('resize',layoutApp);
if(window.visualViewport)window.visualViewport.addEventListener('resize',layoutApp);
layoutApp();

/* ---------------------------------------------------------------- 报错面板 */
function showError(err){
  const box=document.createElement('pre');
  box.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fdd;font-size:11px;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto';
  box.textContent=t('ui.error')+'\n'+(err&&err.stack||err);document.body.appendChild(box);
}
window.addEventListener('error',e=>showError(e.error||e.message));
i18nBoot();cloudBoot();
/*TEST_HOOK*/
requestAnimationFrame(frame);
window.__game=game;window.__ui=ui;window.__act=act;
})();
</script>
